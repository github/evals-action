name: Evals
description: Acquire Vally and run native lint or evaluations with structured GitHub reporting.
author: GitHub
inputs:
  command:
    description: Lint all evals, run a native selection, or report a downloaded structured result. Plan is reserved and unsupported.
    required: true
  working-directory:
    description: Project directory relative to checkout. Required for lint/run; omitted for report.
  suite:
    description: Native named suite for run. Cannot combine with eval-paths or tags. Ignored for lint.
  eval-paths:
    description: Newline-separated literal eval file paths for run. No shell glob expansion. Ignored for lint.
  tags:
    description: Newline-separated native tag selectors for run. Ignored for lint.
  vally-version:
    description: Reviewed stable version; default 0.19.0. latest/exact selections run only when the resolved version has a committed dependency lock.
    default: '0.19.0'
  model:
    description: Explicit native model override; omitted preserves configuration.
  runs:
    description: Positive integer native repetition override.
  workers:
    description: Positive integer native concurrency override.
  timeout:
    description: Positive integer native timeout override in seconds.
  max-retries:
    description: Nonnegative integer native retry override.
  credential-env:
    description: Advanced run-only credential environment names for BYOK or supported secrets. Use copilot-token for the workflow token. Never reuse report-token.
  copilot-token:
    description: Explicit Copilot token for run, normally github.token with copilot-requests write. Mapped to COPILOT_GITHUB_TOKEN; cannot combine with that credential-env name or report-token.
  report-token:
    description: Reporting-only GitHub token with contents read and pull-requests write; report command only.
  report-id:
    description: Stable report identity. Report jobs require a literal unique value and a non-matrix job.
    default: evals
  source-artifact-id:
    description: Positive structured-report artifact ID; report command downloads it directly.
  source-artifact-digest:
    description: SHA-256 digest returned when the structured report artifact was uploaded; report command only.
  upload-transcripts:
    description: Opt in to native JSONL and stdout/stderr logs, which may contain sensitive content.
    default: 'false'
  artifact-retention-days:
    description: Structured artifact retention in days, subject to repository policy.
    default: '7'
outputs:
  outcome:
    description: validated, passed, failed, error, cancelled, or not-run. Lint validation is not an evaluation pass.
  plan-completeness:
    description: Complete native terminal evidence, partial evidence, or unknown. No pre-execution plan is claimed.
  executed:
    description: Number of executed native trial records, excluding skipped records; absent when unknown.
  passed:
    description: Number of executed native eval/variant/model groups with a passing native verdict; absent when unknown.
  failed:
    description: Number of executed native eval/variant/model groups with a failing native verdict; absent when unknown.
  vally-version:
    description: Concrete acquired engine version; absent until acquisition.
  result-path:
    description: Local minimal structured report path.
  artifact-id:
    description: Uploaded structured report artifact identifier.
  artifact-digest:
    description: SHA-256 digest of the uploaded structured report artifact.
  native-diagnostics-path:
    description: Local native output directory. Raw logs are uploaded only when upload-transcripts is true.
runs:
  using: node24
  main: dist/index.cjs
