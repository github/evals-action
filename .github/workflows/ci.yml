name: Model-free CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: lint
          - name: Type check
            command: typecheck
          - name: Unit tests
            command: test:coverage
          - name: Bundle verification
            command: check:package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          store_path="$(corepack pnpm store path --silent)"
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf 'STORE_PATH<<%s\n' "$delim"
            printf '%s\n' "$store_path"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm "${{ matrix.command }}"
      - run: git diff --exit-code
  packaged:
    name: Action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VALLY_TELEMETRY_OPTOUT: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run native mock evaluation through the packaged Action
        id: passing
        uses: ./
        continue-on-error: true
        with:
          command: run
          working-directory: .
          eval-paths: tests/fixtures/pass.eval.yaml
          vally-version: 0.21.0
          report-id: native-pass
      - name: Verify native verdict failure through the same installed CLI
        id: failing
        uses: ./
        continue-on-error: true
        with:
          command: run
          working-directory: .
          eval-paths: tests/fixtures/fail.eval.yaml
          vally-version: 0.21.0
          report-id: native-fail
      - name: Lint through the same installed CLI
        id: lint
        uses: ./
        continue-on-error: true
        with:
          command: lint
          working-directory: tests/fixtures
          vally-version: 0.21.0
          report-id: native-lint
      - name: Check native results and structured uploads
        env:
          PASS_OUTCOME: ${{ steps.passing.outputs.outcome }}
          PASS_STEP: ${{ steps.passing.outcome }}
          FAIL_OUTCOME: ${{ steps.failing.outputs.outcome }}
          FAIL_STEP: ${{ steps.failing.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outputs.outcome }}
          LINT_STEP: ${{ steps.lint.outcome }}
          PASS_ARTIFACT: ${{ steps.passing.outputs.artifact-id }}
          FAIL_ARTIFACT: ${{ steps.failing.outputs.artifact-id }}
          LINT_ARTIFACT: ${{ steps.lint.outputs.artifact-id }}
          EXECUTED: ${{ steps.passing.outputs.executed }}
          FAILED: ${{ steps.failing.outputs.failed }}
        run: |
          test -n "$PASS_ARTIFACT"
          test -n "$FAIL_ARTIFACT"
          test -n "$LINT_ARTIFACT"
          if [ "$PASS_OUTCOME" = not-run ]; then
            test "$PASS_STEP" = success
            test "$FAIL_OUTCOME" = not-run
            test "$LINT_OUTCOME" = not-run
          else
            test "$PASS_OUTCOME" = passed
            test "$PASS_STEP" = success
            test "$EXECUTED" = 1
            test "$FAIL_OUTCOME" = failed
            test "$FAIL_STEP" = failure
            test "$FAILED" = 1
            test "$LINT_OUTCOME" = validated
            test "$LINT_STEP" = success
          fi
