name: Copilot E2E

on:
  pull_request:
    paths:
      - .github/workflows/copilot-e2e.yml
      - .github/workflows/evals.yml
      - action.yml
      - dist/**
      - src/**
      - examples/copilot-smoke/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    uses: ./.github/workflows/evals.yml
    with:
      working-directory: examples/copilot-smoke
      suite: copilot-smoke
      max-retries: '0'
    permissions:
      contents: read
      copilot-requests: write
      pull-requests: write
