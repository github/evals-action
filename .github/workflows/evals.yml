name: Reusable Evals

on:
  workflow_call:
    inputs:
      command:
        description: Run lint, evaluation, or both. Defaults to all, which may use billable model access.
        required: false
        type: string
        default: all
      working-directory:
        description: Project directory relative to the caller's checkout.
        required: true
        type: string
      suite:
        description: Native suite for run/all. Mutually exclusive with eval-paths and tags.
        required: false
        type: string
      eval-paths:
        description: Newline-separated literal eval paths for run/all.
        required: false
        type: string
      tags:
        description: Newline-separated native tag selectors for run/all.
        required: false
        type: string
      report-id:
        description: Stable prefix for this reusable workflow's sticky PR statuses.
        required: false
        type: string
        default: evals
      vally-version:
        description: Reviewed stable Vally version; defaults to the Action's qualified version.
        required: false
        type: string
      model:
        description: Optional native model override for run/all.
        required: false
        type: string
      runs:
        description: Optional positive native repetition override.
        required: false
        type: string
      workers:
        description: Optional positive native concurrency override.
        required: false
        type: string
      timeout:
        description: Optional per-trial native timeout in seconds.
        required: false
        type: string
      max-retries:
        description: Optional nonnegative native retry override.
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Evals configuration
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate requested mode and selection
        env:
          COMMAND: ${{ inputs.command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SUITE: ${{ inputs.suite }}
          EVAL_PATHS: ${{ inputs.eval-paths }}
          TAGS: ${{ inputs.tags }}
          REPORT_ID: ${{ inputs.report-id }}
        run: |
          case "$COMMAND" in
            lint|run|all) ;;
            *) echo "command must be lint, run, or all" >&2; exit 1 ;;
          esac
          test -n "$WORKING_DIRECTORY"
          if [ "$COMMAND" != lint ] && [ -z "$SUITE" ] && [ -z "$EVAL_PATHS" ] && [ -z "$TAGS" ]; then
            echo "run/all requires suite, eval-paths, or tags" >&2
            exit 1
          fi
          if ! [[ "$REPORT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,55}$ ]]; then
            echo "report-id must be 1-56 letters, digits, underscores, or hyphens" >&2
            exit 1
          fi

  lint:
    name: Lint evals
    needs: validate
    if: ${{ github.event_name != 'pull_request_target' && inputs.command == 'lint' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.lint.outputs.artifact-id }}
      artifact-digest: ${{ steps.lint.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint evals
        id: lint
        uses: github/evals-action@eb5a27dd3443b4249ff5d8cd01f1b9e78c74b1b5
        with:
          command: lint
          working-directory: ${{ inputs.working-directory }}
          report-id: ${{ inputs.report-id }}-lint
          vally-version: ${{ inputs.vally-version }}

  run:
    name: Run evals
    needs: validate
    if: ${{ github.event_name != 'pull_request_target' && inputs.command == 'run' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      artifact-id: ${{ steps.evals.outputs.artifact-id }}
      artifact-digest: ${{ steps.evals.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run evals
        id: evals
        uses: github/evals-action@eb5a27dd3443b4249ff5d8cd01f1b9e78c74b1b5
        with:
          command: run
          working-directory: ${{ inputs.working-directory }}
          suite: ${{ inputs.suite }}
          eval-paths: ${{ inputs.eval-paths }}
          tags: ${{ inputs.tags }}
          report-id: ${{ inputs.report-id }}-run
          vally-version: ${{ inputs.vally-version }}
          model: ${{ inputs.model }}
          runs: ${{ inputs.runs }}
          workers: ${{ inputs.workers }}
          timeout: ${{ inputs.timeout }}
          max-retries: ${{ inputs.max-retries }}
          copilot-token: ${{ github.token }}

  all:
    name: Lint and run evals
    needs: validate
    if: ${{ github.event_name != 'pull_request_target' && inputs.command == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      lint-artifact-id: ${{ steps.lint.outputs.artifact-id }}
      lint-artifact-digest: ${{ steps.lint.outputs.artifact-digest }}
      run-artifact-id: ${{ steps.evals.outputs.artifact-id }}
      run-artifact-digest: ${{ steps.evals.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint evals
        id: lint
        uses: github/evals-action@eb5a27dd3443b4249ff5d8cd01f1b9e78c74b1b5
        with:
          command: lint
          working-directory: ${{ inputs.working-directory }}
          report-id: ${{ inputs.report-id }}-lint
          vally-version: ${{ inputs.vally-version }}
      - name: Run evals after successful lint
        id: evals
        if: ${{ steps.lint.outcome == 'success' }}
        uses: github/evals-action@eb5a27dd3443b4249ff5d8cd01f1b9e78c74b1b5
        with:
          command: run
          working-directory: ${{ inputs.working-directory }}
          suite: ${{ inputs.suite }}
          eval-paths: ${{ inputs.eval-paths }}
          tags: ${{ inputs.tags }}
          report-id: ${{ inputs.report-id }}-run
          vally-version: ${{ inputs.vally-version }}
          model: ${{ inputs.model }}
          runs: ${{ inputs.runs }}
          workers: ${{ inputs.workers }}
          timeout: ${{ inputs.timeout }}
          max-retries: ${{ inputs.max-retries }}
          copilot-token: ${{ github.token }}

  report:
    name: Report Evals statuses
    needs: [validate, lint, run, all]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (
        needs.lint.outputs.artifact-id != '' ||
        needs.run.outputs.artifact-id != '' ||
        needs.all.outputs.lint-artifact-id != '' ||
        needs.all.outputs.run-artifact-id != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: evals-${{ github.workflow_ref }}
      cancel-in-progress: false
    steps:
      - name: Update the Evals PR report
        uses: github/evals-action@eb5a27dd3443b4249ff5d8cd01f1b9e78c74b1b5
        with:
          command: report
          source-artifact-id: ${{ needs.run.outputs.artifact-id || needs.all.outputs.run-artifact-id || needs.lint.outputs.artifact-id || needs.all.outputs.lint-artifact-id }}
          source-artifact-digest: ${{ needs.run.outputs.artifact-digest || needs.all.outputs.run-artifact-digest || needs.lint.outputs.artifact-digest || needs.all.outputs.lint-artifact-digest }}
          lint-artifact-id: ${{ (needs.run.outputs.artifact-id != '' || needs.all.outputs.run-artifact-id != '') && needs.all.outputs.lint-artifact-id || '' }}
          lint-artifact-digest: ${{ (needs.run.outputs.artifact-id != '' || needs.all.outputs.run-artifact-id != '') && needs.all.outputs.lint-artifact-digest || '' }}
          report-id: ${{ format('{0}-{1}', inputs.report-id, (needs.run.outputs.artifact-id != '' || needs.all.outputs.run-artifact-id != '') && 'run' || 'lint') }}
          report-token: ${{ github.token }}
        env:
          EVALS_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          EVALS_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EVALS_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          EVALS_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
